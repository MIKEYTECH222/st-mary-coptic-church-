
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صندوق الأسئلة | خدمة الشباب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b16;
      color: #f4f5f8;
    }

    header {
      background: #151c2d;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #30394d;
    }

    header h2 {
      margin: 0;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 18px;
    }

    .welcome, .panel, .question-card {
      background: #171f31;
      border: 1px solid #30394d;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .welcome {
      background: linear-gradient(135deg, #263b68, #394d83);
    }

    .welcome h1 {
      margin-top: 0;
    }

    button, a {
      display: inline-block;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button {
      background: #4665a5;
      color: white;
    }

    a {
      background: #344d83;
      color: white;
    }

    button:hover, a:hover {
      opacity: .85;
    }

    .logout {
      background: #b84242;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 15px 0;
    }

    .filters button {
      background: #30394d;
    }

    .filters button.active {
      background: #526fba;
    }

    .question-card {
      background: #202a40;
      margin-top: 15px;
    }

    .question-text {
      white-space: pre-wrap;
      line-height: 1.9;
      overflow-wrap: anywhere;
      margin: 15px 0;
    }

    .meta {
      color: #aab7d1;
      font-size: 13px;
    }

    .answer-label {
      color: #9db8ff;
      font-weight: bold;
      margin-top: 20px;
    }

    .answer-text {
      white-space: pre-wrap;
      line-height: 1.8;
      overflow-wrap: anywhere;
      background: #141c2c;
      padding: 13px;
      border-radius: 10px;
      margin-top: 8px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      resize: vertical;
      margin: 12px 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #46536d;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    textarea:focus {
      outline: 2px solid #526fba;
    }

    .save-btn {
      background: #23865b;
    }

    .status {
      color: #c5cce0;
      line-height: 1.8;
      margin-top: 18px;
    }

    .empty {
      text-align: center;
      color: #aab7d1;
      padding: 30px 10px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 8px;
    }

    .pending {
      background: #654c20;
      color: #ffdf91;
    }

    .answered {
      background: #1d563f;
      color: #a5f1c8;
    }

    @media(max-width: 550px) {
      header {
        padding: 14px;
      }

      main {
        padding: 12px;
      }

      .welcome, .panel, .question-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>📩 صندوق الأسئلة</h2>

  <div>
    <a id="backLink" href="servant.html">العودة</a>
    <button id="refreshBtn">تحديث</button>
    <button id="logoutBtn" class="logout">خروج</button>
  </div>
</header>

<main>

  <section class="welcome">
    <h1>أهلاً يا <span id="staffName">...</span> 👋</h1>
    <p id="roleText">جاري التحقق من الحساب...</p>
    <p>هنا تقدر تتابع أسئلة المخدومين وترد عليها.</p>
  </section>

  <section class="panel">
    <h2>الأسئلة الواردة</h2>

    <div class="filters">
      <button class="active" data-filter="all">كل الأسئلة</button>
      <button data-filter="pending">بدون رد</button>
      <button data-filter="answered">تم الرد</button>
    </div>

    <p id="countText">جاري تحميل الأسئلة...</p>

    <div id="questionsList"></div>

    <p id="pageMessage" class="status"></p>
  </section>

</main>

<script type="module">
  import { supabase } from "./supabase.js";

  const staffName = document.getElementById("staffName");
  const roleText = document.getElementById("roleText");
  const questionsList = document.getElementById("questionsList");
  const countText = document.getElementById("countText");
  const pageMessage = document.getElementById("pageMessage");
  const backLink = document.getElementById("backLink");

  let currentUser = null;
  let currentProfile = null;
  let allQuestions = [];
  let activeFilter = "all";

  function showMessage(message) {
    pageMessage.textContent = message || "";
  }

  function makeElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
      element.className = className;
    }

    if (text !== undefined) {
      element.textContent = text;
    }

    return element;
  }

  async function checkUser() {
    showMessage("جاري التحقق من الحساب...");

    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError || !authData.user) {
      location.href = "account.html";
      return false;
    }

    currentUser = authData.user;

    const { data: profile, error } = await supabase
      .from("profiles")
      .select("id, full_name, role, approval_status")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (error) {
      showMessage("حدث خطأ أثناء تحميل الحساب: " + error.message);
      return false;
    }

    if (!profile || profile.approval_status !== "approved") {
      await supabase.auth.signOut();
      location.href = "account.html";
      return false;
    }

    if (!["servant", "admin"].includes(profile.role)) {
      showMessage("هذه الصفحة مخصصة للخدام والإدارة فقط.");
      setTimeout(() => {
        location.href = "dashboard.html";
      }, 2000);
      return false;
    }

    currentProfile = profile;

    staffName.textContent = profile.full_name || "خادم";

    if (profile.role === "admin") {
      roleText.textContent = "أنت داخل صندوق الأسئلة بصلاحيات الأدمن.";
      backLink.href = "admin.html";
    } else {
      roleText.textContent = "أنت داخل صندوق الأسئلة الخاص بالأسئلة الموجهة إليك.";
      backLink.href = "servant.html";
    }

    return true;
  }

  async function loadQuestions() {
    questionsList.replaceChildren();
    countText.textContent = "جاري تحميل الأسئلة...";
    showMessage("");

    let assignedQuery = supabase
      .from("servant_questions")
      .select("id, member_id, group_id, servant_id, question, answer, created_at, answered_at")
      .eq("servant_id", currentUser.id)
      .order("created_at", { ascending: false });

    const { data: assignedQuestions, error: assignedError } =
      await assignedQuery;

    if (assignedError) {
      countText.textContent = "تعذر تحميل الأسئلة.";
      showMessage("خطأ: " + assignedError.message);
      return;
    }

    let generalQuestions = [];

    // الأدمن يشوف كمان الأسئلة العامة الموجهة للإدارة.
    if (currentProfile.role === "admin") {
      const { data, error } = await supabase
        .from("servant_questions")
        .select("id, member_id, group_id, servant_id, question, answer, created_at, answered_at")
        .is("servant_id", null)
        .order("created_at", { ascending: false });

      if (error) {
        countText.textContent = "تعذر تحميل الأسئلة العامة.";
        showMessage("خطأ: " + error.message);
        return;
      }

      generalQuestions = data || [];
    }

    allQuestions = [
      ...(assignedQuestions || []),
      ...generalQuestions
    ];

    allQuestions.sort((a, b) => {
      return new Date(b.created_at) - new Date(a.created_at);
    });

    renderQuestions();
  }

  function questionStatus(question) {
    return question.answer && question.answer.trim()
      ? "answered"
      : "pending";
  }

  function formatDate(dateValue) {
    if (!dateValue) return "غير معروف";

    return new Date(dateValue).toLocaleString("ar-EG", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  function createQuestionCard(question) {
    const card = makeElement("article", "question-card");

    const date = makeElement(
      "p",
      "meta",
      "تاريخ السؤال: " + formatDate(question.created_at)
    );

    const member = makeElement(
      "p",
      "meta",
      "رقم العضو: " + question.member_id
    );

    const questionTitle = makeElement("h3", "", "السؤال:");
    const questionText = makeElement(
      "div",
      "question-text",
      question.question
    );

    const isAnswered = questionStatus(question) === "answered";

    const status = makeElement(
      "span",
      "badge " + (isAnswered ? "answered" : "pending"),
      isAnswered ? "تم الرد" : "في انتظار الرد"
    );

    card.append(date, member, questionTitle, questionText, status);

    if (isAnswered) {
      card.append(
        makeElement("p", "answer-label", "الرد الحالي:"),
        makeElement("div", "answer-text", question.answer)
      );
    }

    const answerLabel = makeElement(
      "p",
      "answer-label",
      isAnswered ? "تعديل الرد:" : "اكتب ردك:"
    );

    const answerInput = document.createElement("textarea");
    answerInput.maxLength = 10000;
    answerInput.placeholder = "اكتب ردك هنا...";
    answerInput.value = question.answer || "";

    const saveButton = makeElement(
      "button",
      "save-btn",
      isAnswered ? "حفظ تعديل الرد" : "إرسال الرد"
    );

    saveButton.addEventListener("click", async () => {
      await saveAnswer(question, answerInput, saveButton);
    });

    card.append(answerLabel, answerInput, saveButton);

    return card;
  }

  async function saveAnswer(question, input, button) {
    const answer = input.value.trim();

    if (!answer) {
      showMessage("اكتب الرد الأول قبل الحفظ.");
      input.focus();
      return;
    }

    if (answer.length > 10000) {
      showMessage("الرد طويل جدًا. الحد الأقصى 10000 حرف.");
      return;
    }

    button.disabled = true;
    button.textContent = "جاري الحفظ...";
    showMessage("");

    const updateData = {
      answer: answer,
      answered_at: new Date().toISOString()
    };

    let query = supabase
      .from("servant_questions")
      .update(updateData)
      .eq("id", question.id);

    // تأكيد أن الرد على السؤال الموجه للحساب الحالي.
    if (question.servant_id === null) {
      query = query.is("servant_id", null);
    } else {
      query = query.eq("servant_id", currentUser.id);
    }

    const { error } = await query;

    if (error) {
      showMessage("لم يتم حفظ الرد: " + error.message);
      button.disabled = false;
      button.textContent = "حاول مرة أخرى";
      return;
    }

    showMessage("تم حفظ الرد بنجاح ✅");
    await loadQuestions();
  }

  function renderQuestions() {
    questionsList.replaceChildren();

    let filtered = allQuestions;

    if (activeFilter === "pending") {
      filtered = allQuestions.filter(
        question => questionStatus(question) === "pending"
      );
    }

    if (activeFilter === "answered") {
      filtered = allQuestions.filter(
        question => questionStatus(question) === "answered"
      );
    }

    countText.textContent =
      "إجمالي الأسئلة: " + allQuestions.length +
      " | المعروضة: " + filtered.length;

    if (filtered.length === 0) {
      questionsList.append(
        makeElement("div", "empty", "مفيش أسئلة في القسم ده حاليًا.")
      );
      return;
    }

    filtered.forEach(question => {
      questionsList.append(createQuestionCard(question));
    });
  }

  document.querySelectorAll(".filters button").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      activeFilter = button.dataset.filter;

      renderQuestions();
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", () => {
    loadQuestions();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    location.href = "account.html";
  });

  async function startPage() {
    const allowed = await checkUser();

    if (allowed) {
      await loadQuestions();
    }
  }

  startPage();
</script>

</body>
</html>
