<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاختبارات | شبابنا</title>
<link rel="stylesheet" href="./style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#080b16;color:#f4f6ff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}
nav,.panel,.quiz-card,.question{background:#141d31;border:1px solid #ffffff18;border-radius:17px;padding:18px;margin-bottom:15px}
nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
a,button{border:1px solid #ffffff20;border-radius:11px;padding:10px 15px;background:#2b4276;color:white;text-decoration:none;cursor:pointer;font:inherit}
button:disabled{opacity:.5}textarea{width:100%;min-height:130px;padding:12px;border-radius:11px;background:#0b1323;color:white;border:1px solid #46536d;font:inherit}
.option{display:block;background:#1b2944;padding:12px;border-radius:11px;margin:8px 0;cursor:pointer}.option input{margin-left:8px}
.muted{color:#aebbd3;line-height:1.8}#quizArea,#resultArea{display:none}#message{color:#ffd36a;line-height:1.8}
</style>
</head>
<body><main class="wrap">
<nav><strong>📝 الاختبارات</strong><a href="dashboard.html">الرئيسية</a></nav>
<section class="panel"><h1>الاختبارات المتاحة</h1><p class="muted">اختار الامتحان وابدأ الحل. الأسئلة المقالية لا تظهر درجتها إلا بعد مراجعة الخادم.</p><div id="quizList">جاري تحميل الامتحانات...</div><p id="message" role="status"></p></section>
<section id="quizArea" class="panel"><h2 id="activeTitle"></h2><p id="progress" class="muted"></p><div id="questions"></div><button id="submitQuiz">تسليم الامتحان</button></section>
<section id="resultArea" class="panel"><h2>تم تسليم الامتحان</h2><p id="resultText" class="muted"></p><button id="backToList">العودة للاختبارات</button></section>
</main>
<script type="module">
import{supabase}from"./supabase.js";
const $=id=>document.getElementById(id);
let quizzes=[],activeQuiz=null,profile=null;
function say(t){$("message").textContent=t;}
async function init(){
 const{data:{user},error:ae}=await supabase.auth.getUser();if(ae||!user){location.replace("account.html");return;}
 const{data:p,error:profileError}=await supabase.from("profiles").select("role,approval_status").eq("id",user.id).maybeSingle();
 if(profileError||!p||p.approval_status!=="approved"){say("الحساب غير معتمد.");return;}profile=p;
 const{data,error}=await supabase.rpc("get_member_quizzes");
 if(error){say("تعذر تحميل الاختبارات: "+error.message);return;}
 quizzes=Array.isArray(data)?data:(data||[]);
 renderList();
}
function renderList(){
 const box=$("quizList");box.replaceChildren();
 if(!quizzes.length){box.textContent="لا توجد اختبارات متاحة حاليًا.";return;}
 quizzes.forEach(q=>{
  const card=document.createElement("article");card.className="quiz-card";
  const h=document.createElement("h3");h.textContent=q.title;
  const d=document.createElement("p");d.className="muted";d.textContent=q.description||"";
  const b=document.createElement("button");b.textContent="ابدأ الامتحان";
  b.addEventListener("click",()=>startQuiz(q.id));
  card.append(h,d,b);box.append(card);
 });
}
async function startQuiz(id){
 say("جاري تحميل الامتحان...");
 const{data,error}=await supabase.rpc("get_member_quiz",{p_quiz_id:id});
 if(error){say(error.message);return;}
 activeQuiz=data;
 $("quizList").style.display="none";$("quizArea").style.display="block";$("resultArea").style.display="none";
 $("activeTitle").textContent=data.title;
 $("progress").textContent=`عدد الأسئلة: ${data.questions.length}`;
 const box=$("questions");box.replaceChildren();
 data.questions.forEach((q,i)=>{
  const block=document.createElement("article");block.className="question";
  const h=document.createElement("h3");h.textContent=`${i+1}. ${q.question_text} (${q.max_points} درجة)`;
  block.append(h);
  if(q.question_type==="essay"){
   const t=document.createElement("textarea");t.id="answer-"+q.id;t.placeholder="اكتب إجابتك هنا...";block.append(t);
  }else{
   (q.options||[]).forEach((opt,j)=>{
    const label=document.createElement("label");label.className="option";
    const radio=document.createElement("input");radio.type="radio";radio.name="q-"+q.id;radio.value=j;
    label.append(radio,document.createTextNode(opt));block.append(label);
   });
  }
  box.append(block);
 });
 say("");
}
$("submitQuiz").addEventListener("click",async()=>{
 if(!activeQuiz)return;
 const answers={};
 for(const q of activeQuiz.questions){
  if(q.question_type==="essay")answers[q.id]=$( "answer-"+q.id).value.trim();
  else{
   const chosen=document.querySelector('input[name="q-'+q.id+'"]:checked');
   if(!chosen){say("جاوب على كل أسئلة الاختيار من متعدد قبل التسليم.");return;}
   answers[q.id]=Number(chosen.value);
  }
 }
 const btn=$("submitQuiz");btn.disabled=true;say("جاري تسليم الامتحان...");
 const{data,error}=await supabase.rpc("submit_quiz_with_essays",{p_quiz_id:activeQuiz.id,p_answers:answers});
 btn.disabled=false;
 if(error){say("تعذر تسليم الامتحان: "+error.message);return;}
 $("quizArea").style.display="none";$("resultArea").style.display="block";
 $("resultText").textContent=data.pending_review
  ?"وصلت إجابتك بنجاح. الامتحان يحتوي على سؤال مقالي، والدرجة والنقاط لن تُعتمد إلا بعد مراجعة الخادم أو الأدمن."
  :`نتيجتك ${data.score} من ${data.max_score}. النقاط المضافة: ${data.points_awarded}.`;
 say("");
});
$("backToList").addEventListener("click",()=>{location.reload();});
await init();
</script>
<script src="./install.js"></script>
</body></html>
