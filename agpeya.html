
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأجبية | شبابنا</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  background:#080b16;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  margin:0;
}
.container {max-width:1000px;margin:auto}
.top {
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:30px
}
a {color:inherit;text-decoration:none}
.btn {
  display:inline-block;padding:11px 17px;
  border-radius:12px;background:#ffffff12;
  border:1px solid #ffffff20;color:white;
}
.intro {margin-bottom:25px}
.intro p,.description {color:#aab3c8;line-height:1.9}
.hours {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px
}
.hour-card {
  background:#11182a;border:1px solid #ffffff15;
  padding:22px;border-radius:18px;
  transition:.25s;display:flex;flex-direction:column;
  gap:12px
}
.hour-card:hover {
  transform:translateY(-5px);
  background:#17213a;border-color:#7895ff80
}
.hour-card h3 {margin:0;font-size:19px}
.hour-card p {margin:0;color:#aab3c8;line-height:1.8;font-size:14px}
.hour-card .btn {text-align:center;margin-top:auto}
.status {text-align:center;padding:30px;color:#aab3c8}
.note {
  background:#17213a;border:1px solid #ffffff15;
  padding:16px;border-radius:14px;
  margin:20px 0;color:#cbd5e1;line-height:1.8
}
</style>
</head>

<body>
<main class="container">

  <div class="top">
    <a class="btn" href="dashboard.html">← الرئيسية</a>
    <span>📖 شبابنا | الأجبية</span>
  </div>

  <section class="intro">
    <h1>الأجبية المقدسة</h1>
    <p>صلوات السواعي اليومية في الكنيسة القبطية الأرثوذكسية.</p>
  </section>

  <div class="note">
    اختر الصلاة لفتح نصها وترتيبها من موقع الأنبا تكلا.
  </div>

  <div id="status" class="status">جاري تحميل الصلوات...</div>
  <section id="hours" class="hours"></section>

</main>

<script type="module">
import { supabase } from "./supabase.js";

const hoursBox = document.getElementById("hours");
const statusBox = document.getElementById("status");

async function init() {
  const {data:{user},error:authError} =
    await supabase.auth.getUser();

  if (authError || !user) {
    location.href = "index.html";
    return;
  }

  const {data:profile,error:profileError} = await supabase
    .from("profiles")
    .select("role,approval_status")
    .eq("id",user.id)
    .single();

  if (profileError || !profile ||
      (profile.role !== "admin" &&
       profile.approval_status !== "approved")) {
    statusBox.textContent = "ليس لديك صلاحية الدخول.";
    return;
  }

  const {data,error} = await supabase
    .from("agpeya_hours")
    .select("id,title,description,sort_order,source_url")
    .order("sort_order");

  if (error) {
    statusBox.textContent = "حدث خطأ: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    statusBox.textContent = "لا توجد صلوات.";
    return;
  }

  statusBox.remove();

  data.forEach(hour => {
    const card = document.createElement("article");
    card.className = "hour-card";

    const title = document.createElement("h3");
    title.textContent = "📖 " + hour.title;

    const description = document.createElement("p");
    description.textContent = hour.description || "";

    const link = document.createElement("a");
    link.className = "btn";
    link.textContent = "قراءة الصلاة ←";
    link.href = hour.source_url || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    if (!hour.source_url) {
      link.textContent = "المصدر غير متاح";
      link.removeAttribute("href");
    }

    card.append(title,description,link);
    hoursBox.appendChild(card);
  });
}

init();
</script>
</body>
</html>
