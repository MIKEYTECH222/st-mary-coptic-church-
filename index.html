
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>شبابنا | تسجيل الدخول</title>
  <link rel="icon" href="./Untitled-1.png">
  <link rel="stylesheet" href="./style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 25px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 10%, #27365d 0, transparent 35%),
        radial-gradient(circle at 85% 90%, #25234b 0, transparent 35%),
        #080b16;
      color: #f5f6ff;
      font-family: Arial, sans-serif;
    }

    .auth-container {
      width: min(100%, 480px);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 26px;
      background: rgba(24,31,49,.78);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .brand h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    .brand p {
      color: #aab4ca;
      margin: 0;
      line-height: 1.7;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border-radius: 13px;
      background: #111827;
      margin-bottom: 22px;
    }

    .auth-tabs button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      color: #b8c1d4;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .auth-tabs button.active {
      color: white;
      background: #354777;
    }

    .auth-form {
      display: grid;
      gap: 13px;
    }

    .auth-form h2 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    label {
      color: #d8deed;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #39445b;
      border-radius: 11px;
      outline: none;
      background: #101827;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b9fff;
      box-shadow: 0 0 0 3px rgba(139,159,255,.12);
    }

    .submit-btn {
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg,#667eea,#5364c8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .google-btn {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #46516a;
      border-radius: 11px;
      background: #202a3d;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .status {
      min-height: 25px;
      margin: 12px 0 0;
      color: #c8d3ed;
      line-height: 1.8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #8792aa;
      font-size: 13px;
    }

    @media(max-width: 450px) {
      .auth-container { padding: 22px 17px; }
      .brand h1 { font-size: 24px; }
    }
  </style>
</head>

<body>

  <main class="auth-container">

    <header class="brand">
      <img src="./Untitled-1.png" alt="شعار الخدمة">
      <h1>شبابنا</h1>
      <p>إيمان يجمعنا، ومحبة تكبر بينا.</p>
    </header>

    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">تسجيل الدخول</button>
      <button id="signupTab" type="button">إنشاء حساب</button>
    </div>

    <form id="loginForm" class="auth-form">
      <h2>أهلاً بعودتك 👋</h2>

      <label for="loginEmail">البريد الإلكتروني</label>
      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
        required
        placeholder="example@email.com"
      >

      <label for="loginPassword">كلمة المرور</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
        placeholder="كلمة المرور"
      >

      <button class="submit-btn" type="submit">تسجيل الدخول</button>
      <p id="loginMessage" class="status" role="status"></p>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <h2>انضم لأسرة الشباب ✨</h2>

      <label for="signupName">الاسم الكامل</label>
      <input
        id="signupName"
        maxlength="100"
        autocomplete="name"
        required
        placeholder="اكتب اسمك بالكامل"
      >

      <label for="signupEmail">البريد الإلكتروني</label>
      <input
        id="signupEmail"
        type="email"
        autocomplete="email"
        required
        placeholder="example@email.com"
      >

      <label for="signupPassword">كلمة المرور</label>
      <input
        id="signupPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="8 أحرف على الأقل"
      >

      <button class="submit-btn" type="submit">إنشاء الحساب</button>
      <p id="signupMessage" class="status" role="status"></p>
    </form>

    <button id="googleLoginBtn" class="google-btn" type="button">
      تسجيل الدخول باستخدام Google
    </button>

    <p id="accountMessage" class="status" role="status"></p>

    <footer>
      خدمة الشباب • إيمان ومحبة ونمو
    </footer>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
